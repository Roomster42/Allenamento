<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>PB Coach V1</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef7;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#111a2beF;border-bottom:1px solid #27334a;backdrop-filter:blur(10px)}.head{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.logo{font-size:19px;font-weight:850;letter-spacing:-.5px}.logo span{color:#76e3c0}.muted{color:#a4b0c5}.tiny{font-size:12px}.pill{border:1px solid #34536a;border-radius:99px;padding:5px 9px;font-size:11px;color:#8de9cc}.wrap{max-width:1050px;margin:auto;padding:22px 16px 100px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px;padding-bottom:4px}.nav button{background:#172238;border:1px solid #2b3952;color:#c9d5e8;padding:10px 15px;border-radius:11px;white-space:nowrap}.nav button.active{background:#146d62;color:#fff;border-color:#28a58c}.hero{background:linear-gradient(120deg,#173b4b,#18253c);border:1px solid #2d5b66;border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{font-size:26px;margin:5px 0 8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#151f31;border:1px solid #2b3850;border-radius:16px;padding:17px;margin-bottom:14px}.card h2{font-size:17px;margin:0 0 12px}.stat{font-size:28px;font-weight:800;margin:8px 0}.button{border:0;border-radius:10px;padding:11px 14px;background:#20ad91;color:#062b27;font-weight:750}.button.secondary{background:#26354d;color:#e1e9f4}.button.danger{background:#693343;color:#fff}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.daylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.day{background:#162337;border:1px solid #34445e;border-radius:14px;padding:17px;text-align:left;color:#fff}.day:hover{border-color:#2cbe9e}.day b{display:block;margin:5px 0}.day small{color:#a8b8ce}.badge{display:inline-block;background:#214a49;color:#8be4c7;padding:4px 7px;border-radius:7px;font-size:11px}.exercise{border-top:1px solid #334056;padding:17px 0}.exercise:first-of-type{border-top:0}.exercise h3{margin:0 0 7px;font-size:16px}.prescription{color:#91e4c8;font-weight:650;font-size:14px}.note{font-size:13px;color:#b6c4d7;margin:8px 0;line-height:1.5}.setrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 45px;gap:7px;align-items:end;margin:9px 0}.setrow label{font-size:11px;color:#aebbd0;display:block;margin-bottom:3px}.setrow input{width:100%;min-width:0;background:#0d1728;color:#fff;border:1px solid #3b4d66;border-radius:8px;padding:10px 5px}.setrow input[type=checkbox]{width:19px;height:19px;accent-color:#20ad91}.setrow .check{text-align:center}.subhead{font-size:12px;color:#93a4ba}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field textarea,.field select{background:#0e192a;color:#eaf1f8;border:1px solid #41516b;border-radius:10px;padding:11px;width:100%}.field textarea{min-height:70px}.back{background:transparent;color:#8fe6cc;border:0;padding:10px 0}.history{padding:12px 0;border-bottom:1px solid #334056}.history:last-child{border:0}.progress{height:9px;background:#26354c;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#2bc4a3}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:#aab8cb}.footer{font-size:12px;color:#9baac0;margin-top:20px;line-height:1.5}a{color:#8ce8d0} .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.daylist{grid-template-columns:1fr}.hero h1{font-size:23px}.wrap{padding:16px 12px 90px}.card{padding:13px}.setrow{grid-template-columns:28px repeat(3,minmax(0,1fr)) 28px;gap:5px}.setrow input{padding:9px 3px}.two{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><div class="logo">PB <span>COACH</span> <span class="tiny muted">V1</span></div><span class="pill">PERSONALE · OFFLINE</span></div></header><main class="wrap"><nav class="nav" id="nav"><button data-page="home">Dashboard</button><button data-page="plan">Scheda</button><button data-page="history">Diario</button><button data-page="stats">Statistiche</button><button data-page="settings">Impostazioni</button></nav><div id="app"></div></main><script>
'use strict';
const SOURCE='Scheda del 29 ottobre 2026 · Ricomposizione corporea';
const ex=(name,sets,reps,rest,note='',kind='standard',extra={})=>({name,sets,reps,rest,note,kind,...extra});
const days=[
{id:'lower-a',title:'Lower A + Metcon',type:'Pesi',exercises:[ex('Back Squat con bilanciere',1,'4–6',150,'Top set RPE 8 (circa 2 ripetizioni in riserva). Prima esegui 3 serie di avvicinamento.','top'),ex('Back Squat con bilanciere — back-off',3,'5',120,'Carico pari al 90% del top set squat.','backoff',{parent:'Back Squat con bilanciere'}),ex('Hip Thrust con bilanciere',3,'8',90,'Isometria di picco 1–2 secondi su ogni ripetizione.'),ex('Affondi alternati dietro con manubri',2,'8 per gamba',75,'Anche non alternati; busto leggermente flesso, enfasi sui glutei.'),ex('Plank su Swiss Ball',2,'30 sec',30),ex('EMOM 8 minuti',1,'8 min',0,'Minuti dispari: 12 Russian Swing con manubrio. Minuti pari: 10 push-up (range 8–12).','timed')]},
{id:'upper-a',title:'Upper A',type:'Pesi',exercises:[ex('Military Press',1,'4–6',120,'Top set RPE 8; preceduto da 3 serie di avvicinamento.','top'),ex('Military Press — back-off',2,'6',120,'90% del carico del top set military press.','backoff',{parent:'Military Press'}),ex('Trazioni alla sbarra',3,'4–6',90,'Corpo libero. Se necessario, pausa di 20 sec per completare il range. A 4–5 strict a cedimento tecnico, 2–3 negative controllate da 4–5 sec.'),ex('Panca piana manubri',3,'8–10',90,'Aumenta il carico quando completi 10 ripetizioni in tutte e 3 le serie. Eccentrica controllata.'),ex('Rematore prono su panca inclinata con manubri',3,'8–10',75,'Panca a 30°; isometria di 1 sec su ogni ripetizione.'),ex('Superset: aperture laterali + reverse fly',2,'12 + 12',45,'Esegui 12 aperture laterali con manubri e 12 reverse fly per ogni giro.','superset')]},
{id:'lower-b',title:'Lower B',type:'Pesi',exercises:[ex('Stacchi con bilanciere',1,'3–5',150,'Top set RPE 8; preceduto da 3 serie di avvicinamento.','top'),ex('Stacchi con bilanciere — back-off',2,'4',120,'90% del carico del top set stacco.','backoff',{parent:'Stacchi con bilanciere'}),ex('Bulgarian Split Squat con manubri',3,'6–8 per gamba',90,'Aumenta il carico dopo 8 ripetizioni in tutte le serie; eccentrica controllata, senza cedimento.'),ex('Leg Curl',3,'10–12',75,'Alternativa: sliding leg curl supina a terra.'),ex('Copenhagen Plank',2,'20–30 sec per lato',30)]},
{id:'upper-b',title:'Upper B + Metcon',type:'Pesi',exercises:[ex('Panca inclinata bilanciere',1,'5–6',120,'Top set RPE 8; preceduto da 3 serie di avvicinamento.','top'),ex('Panca inclinata bilanciere — back-off',2,'6–8',90,'90% del carico del top set panca inclinata.','backoff',{parent:'Panca inclinata bilanciere'}),ex('Rematore con manubrio singolo',3,'8–10 per lato',90),ex('Lat Machine presa inversa',3,'8–10',90,'Alternativa: trazioni presa supina, 3 serie a massimo ripetizioni.'),ex('Superset: aperture laterali + reverse fly',2,'12 + 12',45,'Esegui 12 aperture laterali e 12 reverse fly per ogni giro.','superset'),ex('EMOM 9 minuti',1,'9 min',0,'Minuto 1: 6 Devil Press. Minuto 2: 8 Renegade Row totali, lente. Minuto 3: Farmer’s Walk 30–40 metri. Ripeti per 3 giri.','timed')]},
{id:'cardio',title:'Cardio LISS · facoltativo',type:'Cardio',exercises:[ex('Camminata in pendenza o cyclette',1,'40 min',0,'Zona 2, ritmo conversazionale: 5 min riscaldamento, 30 min centrali, 5 min defaticamento.','timed')]}
];
const warm=['Cyclette blanda · 2 min','World Greatest Stretch · 1×5 per lato','Mobilità anche 90/90 · 1×6 per lato','Hip Airplane · 1×5 per lato','L to Y Exercise · 1×8','Deadbug · 1×8 per lato'];
const cool=['Butterfly pose · 1 min 30 sec','Lying gluteus stretch · 30 sec per lato','Stretching psoas · 1 min 30 sec','Legs up the wall · 2–3 min'];
const KEY='pbcoach_v1';const fresh=()=>({sessions:[],drafts:{},settings:{round:2.5}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(data.sessions)||!data.drafts||!data.settings)throw 0}catch{data=fresh()}let page='home',activeDay=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Salvataggio non riuscito: spazio browser insufficiente. Esporta un backup.');return false}};
const formatDate=s=>new Date(s).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});const setCount=d=>d.exercises.reduce((a,e)=>a+e.sets,0);const doneSets=s=>s.exercises.reduce((a,e)=>a+e.sets.filter(v=>v.done).length,0);const totalSets=s=>s.exercises.reduce((a,e)=>a+e.sets.length,0);
function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}function go(p,id=null){page=p;activeDay=id;render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function lastFor(name){for(const s of [...data.sessions].reverse())for(const e of s.exercises)if(e.name===name){const found=e.sets.find(v=>Number(v.kg)>0);if(found)return found.kg}return ''}
function draft(day){if(!data.drafts[day.id])data.drafts[day.id]={date:new Date().toISOString().slice(0,10),notes:'',exercises:day.exercises.map(e=>({name:e.name,sets:Array.from({length:e.sets},()=>({kg:lastFor(e.name),reps:'',rpe:'',done:false}))}))};return data.drafts[day.id]}
function topWeight(d,parent){const e=d.exercises.find(e=>e.name===parent);return Number(e?.sets?.[0]?.kg)||0}function backoff(d,e){const t=topWeight(d,e.parent);if(!t)return null;const step=Number(data.settings.round)||2.5;return Math.round((t*.9)/step)*step}
function home(){const sessions=data.sessions;const complete=sessions.filter(s=>s.dayId!=='cardio').length;const last=sessions.at(-1);return `<section class="hero"><div class="tiny muted">PROGRAMMA ATTIVO · ${SOURCE}</div><h1>Il tuo allenamento, sotto controllo.</h1><div class="muted">4 giornate pesi + cardio facoltativo. Registra ogni serie, monitora i carichi e conserva lo storico.</div><div class="actions"><button class="button" onclick="go('plan')">Apri la scheda</button><button class="button secondary" onclick="go('history')">Vedi diario</button></div></section><div class="grid"><div class="card"><div class="muted tiny">Sessioni pesi</div><div class="stat">${complete}</div></div><div class="card"><div class="muted tiny">Cardio svolti</div><div class="stat">${sessions.length-complete}</div></div><div class="card"><div class="muted tiny">Serie registrate</div><div class="stat">${sessions.reduce((a,s)=>a+doneSets(s),0)}</div></div></div><div class="card"><h2>Le tue giornate</h2><div class="daylist">${days.map((d,i)=>`<button class="day" onclick="go('workout','${d.id}')"><span class="badge">${d.type==='Cardio'?'FACOLTATIVO':'GIORNO '+(i<2?i+1:i)}</span><b>${esc(d.title)}</b><small>${d.exercises.length} blocchi · ${setCount(d)} serie/blocchi</small></button>`).join('')}</div></div><div class="card"><h2>Ultima sessione</h2>${last?`<p>${esc(last.title)} · ${formatDate(last.date)} · ${doneSets(last)}/${totalSets(last)} serie completate</p>`:'<p class="muted">Nessun allenamento ancora registrato.</p>'}</div>`}
function plan(){return `<section class="hero"><h1>Programma originale</h1><div class="muted">29 ottobre 2026 · 4 sedute pesi + 1 cardio facoltativa. Nessuna modifica automatica alla prescrizione.</div></section><div class="daylist">${days.map((d,i)=>`<button class="day" onclick="go('workout','${d.id}')"><span class="badge">${d.type==='Cardio'?'CARDIO FACOLTATIVO':'PESI '+(i<2?i+1:i)}</span><b>${esc(d.title)}</b><small>${d.exercises.map(e=>e.name).join(' · ')}</small></button>`).join('')}</div><div class="card" style="margin-top:14px"><h2>Riscaldamento originale</h2>${warm.map(x=>`<div class="note">• ${esc(x)}</div>`).join('')}<h2 style="margin-top:18px">Defaticamento originale</h2>${cool.map(x=>`<div class="note">• ${esc(x)}</div>`).join('')}</div>`}
function workout(){const day=days.find(x=>x.id===activeDay);if(!day)return go('plan');const d=draft(day);return `<button class="back" onclick="go('plan')">← Torna alla scheda</button><section class="hero"><span class="badge">${day.type==='Cardio'?'CARDIO FACOLTATIVO':'ALLENAMENTO PESI'}</span><h1>${esc(day.title)}</h1><div class="muted">Compila kg, ripetizioni e RPE effettivi. Spunta ogni serie completata.</div></section><div class="card"><div class="field"><label>Data della seduta</label><input type="date" id="session-date" value="${esc(d.date)}" onchange="updateMeta('date',this.value)"></div><div class="progress"><div style="width:${100*doneSets(d)/totalSets(d)}%"></div></div><div class="tiny muted" style="margin-top:7px">${doneSets(d)} di ${totalSets(d)} serie/blocchi spuntati</div></div><div class="card">${day.exercises.map((e,i)=>{const b=e.kind==='backoff'?backoff(d,e):null;return `<div class="exercise"><h3>${esc(e.name)}</h3><div class="prescription">${e.sets} × ${esc(e.reps)} ${e.rest?'· recupero '+e.rest+' sec':''}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}${b!==null?`<div class="badge">Carico back-off suggerito: ${b.toLocaleString('it-IT')} kg</div>`:''}${e.kind==='top'?'<div class="note">Le 3 serie di avvicinamento sono previste dal PDF, ma non conteggiate come serie di lavoro.</div>':''}${d.exercises[i].sets.map((s,j)=>`<div class="setrow"><div class="subhead">#${j+1}</div><div><label>${e.kind==='timed'?'Carico kg':'Kg'}</label><input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(s.kg)}" oninput="updateSet(${i},${j},'kg',this.value)"></div><div><label>${e.kind==='timed'?'Min/reps':'Rip.'}</label><input type="text" value="${esc(s.reps)}" oninput="updateSet(${i},${j},'reps',this.value)"></div><div><label>RPE</label><input type="number" min="1" max="10" step="0.5" value="${esc(s.rpe)}" oninput="updateSet(${i},${j},'rpe',this.value)"></div><div class="check"><label>Fatto</label><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${i},${j},'done',this.checked)"></div></div>`).join('')}</div>`}).join('')}<div class="field"><label>Note della seduta</label><textarea oninput="updateMeta('notes',this.value)">${esc(d.notes)}</textarea></div><div class="actions"><button class="button" onclick="finish()">Salva allenamento nel diario</button><button class="button secondary" onclick="go('plan')">Continua più tardi</button></div></div><div class="card"><h2>Riscaldamento e defaticamento</h2><div class="note">${warm.map(esc).join(' · ')}</div><hr style="border:0;border-top:1px solid #344057"><div class="note">${cool.map(esc).join(' · ')}</div></div>`}
function updateSet(i,j,k,v){const d=draft(days.find(x=>x.id===activeDay));d.exercises[i].sets[j][k]=v;save();if(k==='done'){const p=document.querySelector('.progress>div');if(p)p.style.width=100*doneSets(d)/totalSets(d)+'%';const label=document.querySelector('.progress+.tiny');if(label)label.textContent=`${doneSets(d)} di ${totalSets(d)} serie/blocchi spuntati`;}if(k==='kg'&&i===0){/* refresh backoff hint without interrupting editing */const el=document.querySelector('.exercise:nth-of-type(2) .badge');if(el){const b=backoff(d,days.find(x=>x.id===activeDay).exercises[1]);el.textContent=b===null?'':`Carico back-off suggerito: ${b.toLocaleString('it-IT')} kg`;}}}
function updateMeta(k,v){draft(days.find(x=>x.id===activeDay))[k]=v;save()}
function finish(){const day=days.find(x=>x.id===activeDay),d=draft(day);if(!doneSets(d)){alert('Spunta almeno una serie/blocco completato prima di salvare.');return}if(!confirm('Salvare questa sessione nel diario?'))return;data.sessions.push({...structuredClone(d),id:Date.now()+'-'+Math.random().toString(36).slice(2,7),dayId:day.id,title:day.title,savedAt:new Date().toISOString()});delete data.drafts[day.id];save();go('history')}
function history(){return `<section class="hero"><h1>Diario allenamenti</h1><div class="muted">Le sessioni sono salvate in questo browser. Esporta regolarmente un backup dalle Impostazioni.</div></section><div class="card">${data.sessions.length?[...data.sessions].reverse().map(s=>`<div class="history"><b>${esc(s.title)}</b><div class="muted tiny">${formatDate(s.date)} · ${doneSets(s)}/${totalSets(s)} serie completate</div><div class="actions"><button class="button secondary" onclick="viewSession('${s.id}')">Dettagli</button><button class="button danger" onclick="deleteSession('${s.id}')">Elimina</button></div></div>`).join(''):'<div class="empty">Nessuna sessione salvata. Apri la Scheda per iniziare.</div>'}</div>`}
function viewSession(id){const s=data.sessions.find(x=>x.id===id);if(!s)return;page='detail';$('app').innerHTML=`<button class="back" onclick="go('history')">← Diario</button><div class="card"><h2>${esc(s.title)} · ${formatDate(s.date)}</h2>${s.exercises.map(e=>`<div class="exercise"><b>${esc(e.name)}</b>${e.sets.map((v,i)=>`<div class="note">Serie ${i+1}: ${esc(v.kg||'—')} kg · ${esc(v.reps||'—')} rip/min · RPE ${esc(v.rpe||'—')} ${v.done?'✓':'(non completata)'}</div>`).join('')}</div>`).join('')}<p class="note">${esc(s.notes)}</p></div>`;nav()}
function deleteSession(id){if(!confirm('Eliminare definitivamente questa sessione?'))return;data.sessions=data.sessions.filter(s=>s.id!==id);save();render()}
function stats(){const entries=[];for(const s of data.sessions)for(const e of s.exercises)for(const set of e.sets)if(set.done&&Number(set.kg)>0)entries.push({name:e.name,kg:Number(set.kg),date:s.date,reps:parseInt(set.reps)||0});const names=[...new Set(entries.map(x=>x.name))];const volume=entries.reduce((a,e)=>a+e.kg*e.reps,0);return `<section class="hero"><h1>Statistiche</h1><div class="muted">Dati ricavati esclusivamente dalle sessioni registrate.</div></section><div class="grid"><div class="card"><div class="tiny muted">Sessioni</div><div class="stat">${data.sessions.length}</div></div><div class="card"><div class="tiny muted">Serie con kg</div><div class="stat">${entries.length}</div></div><div class="card"><div class="tiny muted">Volume registrato*</div><div class="stat" style="font-size:22px">${Math.round(volume).toLocaleString('it-IT')} kg</div></div></div><div class="card"><h2>Carichi massimi registrati per esercizio</h2>${names.length?names.map(n=>{const arr=entries.filter(x=>x.name===n),max=Math.max(...arr.map(x=>x.kg));return `<div class="history"><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(n)}</span><b>${max.toLocaleString('it-IT')} kg</b></div><div class="progress" style="margin-top:8px"><div style="width:${100*max/Math.max(...entries.map(x=>x.kg))}%"></div></div><div class="tiny muted">${arr.length} serie con carico</div></div>`}).join(''):'<div class="empty">I grafici compariranno dopo le prime sessioni.</div>'}</div><div class="footer">* Volume = kg × ripetizioni delle serie spuntate, quando le ripetizioni sono numeriche. Per esercizi unilaterali, superset e blocchi a tempo il dato non è una misura completa del lavoro.</div>`}
function settings(){return `<section class="hero"><h1>Impostazioni e backup</h1><div class="muted">I dati restano sul dispositivo/browser, non vengono inviati a un server.</div></section><div class="card"><h2>Calcolo back-off</h2><div class="field"><label>Arrotondamento carico (kg)</label><select onchange="data.settings.round=Number(this.value);save()">${[0.5,1,2.5,5].map(x=>`<option value="${x}" ${Number(data.settings.round)===x?'selected':''}>${x} kg</option>`).join('')}</select></div><div class="note">Il back-off è il 90% del top set della stessa sessione, arrotondato al passo selezionato. Il suggerimento non modifica i valori inseriti.</div></div><div class="card"><h2>Esporta o importa i dati</h2><div class="actions"><button class="button" onclick="exportData()">Scarica backup JSON</button><label class="button secondary" style="cursor:pointer">Importa backup<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label></div><div class="note">L'importazione sostituisce il diario e le bozze attuali. Non usare la modalità anonima del browser per conservare dati importanti.</div></div><div class="card"><h2>Fonte del programma</h2><p class="note">${SOURCE}</p><a target="_blank" rel="noopener noreferrer" href="https://drive.google.com/file/d/113WI5eLqFBhJrNAVDvpv8z5eNWcPLZN8/view">Apri il PDF originale su Drive</a><p class="note">Il piano rimane quello originale; questa V1 non genera nuove schede né modifica automaticamente la programmazione.</p></div><div class="card"><h2>Eliminazione dati</h2><button class="button danger" onclick="resetAll()">Cancella tutti i dati locali</button></div>`}
function exportData(){const blob=new Blob([JSON.stringify({app:'PB Coach V1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pb-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(input){const f=input.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(parsed.app!=='PB Coach V1'||!parsed.data||!Array.isArray(parsed.data.sessions)||typeof parsed.data.drafts!=='object'||typeof parsed.data.settings!=='object')throw Error('Formato non valido');if(!confirm('Sostituire tutti i dati locali con quelli del backup?'))return;data=parsed.data;save();render();alert('Backup importato.')}catch(e){alert('Impossibile importare il backup: '+e.message)}finally{input.value=''}}
function resetAll(){if(!confirm('Eliminare tutte le sessioni, bozze e impostazioni? Questa operazione non è reversibile.'))return;data=fresh();save();go('home')}
function render(){nav();$('app').innerHTML=page==='home'?home():page==='plan'?plan():page==='workout'?workout():page==='history'?history():page==='stats'?stats():page==='settings'?settings():''}render();
</script></body></html>
